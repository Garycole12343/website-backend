version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: skillswap-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: skillswap-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/skillswap
      - SECRET_KEY=skillswap-dev-secret-2026-change-prod!
      - VITE_ORIGIN=http://localhost:80
      - PORT=5000
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: skillswap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
